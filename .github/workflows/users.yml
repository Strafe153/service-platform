name: users

on:
  push:
    branches:
      - main
    paths:
      - 'users/**' 
  pull_request:
    branches:
      - main
    paths:
      - 'users/**'
  workflow_dispatch:

env:
  API_PATH: ./Users.Api/Users.Api.csproj
  INTEGRATION_TESTS_PATH: ./Tests/Integration.Tests/Integration.Tests.csproj

jobs:
  build_users:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./users
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore $API_PATH --locked-mode
      - name: Build API
        run: dotnet build $API_PATH --no-restore -c Release

      - name: Restore integration tests dependencies
        run: dotnet restore $INTEGRATION_TESTS_PATH --locked-mode
      - name: Run integration tests
        run: dotnet test $INTEGRATION_TESTS_PATH -c Release