services:
  users:
    build:
      context: ./users
      dockerfile: ./Dockerfile
    container_name: users
    ports:
      - 5062:5062
    depends_on:
      - sql_server
      - rabbit_mq
      - keycloak
      - otel-collector
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5062
      - ConnectionStrings__Database=Server=sql_server,1433;Database=users;User Id=sa;Password=pa5sw0rd!;TrustServerCertificate=true;
      - RabbitMq__Host=rabbit_mq
      - Keycloak__auth-server-url=http://keycloak:8080/
      - KeycloakAdmin__auth-server-url=http://keycloak:8080/
      - OpenTelemetry__Endpoint=http://otel-collector:4317

  sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: users_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=${USERS_PASS}
    ports:
      - 1433:1433
    restart: always
    volumes:
      - sql_server_data:/var/opt/mssql

  rabbit_mq:
    image: rabbitmq:4.2.0-management
    container_name: rabbit_mq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_MQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_MQ_PASS}
    ports:
      - 5672:5672
      - 15672:15672

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASS}
      - KC_HOSTNAME=keycloak # comment out for local development
    command: start-dev
    ports:
      - 8080:8080
    volumes:
      - keycloak_data:/opt/keycloak/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317
    depends_on:
      - prometheus
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:main
    container_name: prometheus
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  tempo:
    image: grafana/tempo:main-3512f88-2003-1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    ports:
      - 3200:3200

  loki:
    image: grafana/loki:main-70ef585
    container_name: loki
    ports:
      - 3100:3100

  grafana:
    image: grafana/grafana-enterprise:13.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3001:3000
    volumes:
      - grafana_data:/var/lib/grafana

  mailpit:
    image: axllent/mailpit:v1.29
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH: ${MAILPIT_USER}:${MAILPIT_PASS}
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  mongo_db:
    image: mongo:7.0.13-rc0
    container_name: orders_db
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db


volumes:
  sql_server_data:
  keycloak_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  mongodb-data:
